<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b6df0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TimeClock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TimeClock</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b2030;--muted:#6b7385;--line:#e1e5ee;--primary:#3b6df0;--ok:#1f9d55;--bad:#d64545}
[data-theme="dark"]{--bg:#0f1320;--card:#181e30;--text:#eef1f8;--muted:#9aa3b8;--line:#2a3350;--primary:#6c8cff;--ok:#2fbf71;--bad:#ef6a6a}
*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
.app,.auth{max-width:760px;margin:0 auto;padding:16px}
.auth{max-width:420px;padding-top:40px}
.hero{text-align:center;margin-bottom:16px}
.logo{font-size:44px}
h1{font-size:24px;margin:6px 0}h2{font-size:18px;margin:0 0 10px}h3{font-size:16px;margin:0 0 6px}
p{margin:6px 0;color:var(--muted)}
.card,.item,.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.item{margin-bottom:8px;background:transparent}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{text-align:center;font-size:14px;color:var(--muted)}.stat b{display:block;font-size:26px;color:var(--text)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
textarea{min-height:80px}
button{font-size:15px;font-weight:600;padding:10px 14px;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:var(--card);color:var(--text)}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button.success{background:var(--ok);border-color:var(--ok);color:#fff}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button.big{padding:14px 18px;font-size:17px}
button:disabled{opacity:.6}
.small{font-size:13px;color:var(--muted)}
a{color:var(--primary)}
.badge,.status{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.status.working{background:var(--ok);border-color:var(--ok);color:#fff}
.code{font-size:30px;font-weight:700;letter-spacing:4px;font-family:ui-monospace,monospace;text-align:center;padding:10px}
.empty{color:var(--muted);text-align:center;padding:14px}
.notice,.error{padding:10px 14px;border-radius:10px;margin:10px 0;font-size:14px}
.notice{background:rgba(31,157,85,.15);color:var(--ok)}
.error{background:rgba(214,69,69,.15);color:var(--bad)}
.picker{display:flex;gap:8px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);width:min(92vw,420px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js?v=10"></script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))</script>
</body>
</html>
